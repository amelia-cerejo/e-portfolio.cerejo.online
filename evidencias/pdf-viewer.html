<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizador de PDF | e-Portefolio</title>
  <style>
    :root { --blue:#002b5b; --gold:#bd8a12; --line:#d8e0ea; --bg:#f7f4f2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:#1c1b1b; font-family: Inter, Arial, sans-serif; }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 20px; background:#fff; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:15px; color:var(--blue); font-weight:800; }
    .actions { display:flex; gap:10px; align-items:center; }
    .button { border:1px solid var(--line); background:#fff; color:var(--blue); border-radius:999px; min-width:44px; height:44px; display:inline-grid; place-items:center; padding:0 14px; text-decoration:none; font-weight:800; cursor:pointer; box-shadow:0 10px 24px rgba(0,43,91,.12); }
    .button.gold { background:#fff7e3; border-color:#d5a02a; color:#7a5200; }
    .button svg { width:21px; height:21px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    main { height:calc(100vh - 64px); }
    iframe, object { width:100%; height:100%; border:0; background:#fff; display:block; }
    .fallback { padding:24px; }
    .floating-back { position:fixed; right:22px; bottom:22px; z-index:30; width:52px; height:52px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--blue); display:grid; place-items:center; box-shadow:0 16px 34px rgba(0,43,91,.18); cursor:pointer; }
    .floating-back svg { width:24px; height:24px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    @media print { header, .floating-back { display:none; } main { height:100vh; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Documento PDF</h1>
    <div class="actions">
      <button class="button" type="button" onclick="goBack()" title="Voltar" aria-label="Voltar">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h12"/></svg>
      </button>
      <a class="button gold" id="open-file" href="#" target="_blank" rel="noopener" title="Abrir PDF" aria-label="Abrir PDF">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
      </a>
    </div>
  </header>
  <main id="viewer"></main>
  <button class="floating-back" type="button" onclick="goBack()" title="Voltar" aria-label="Voltar">
    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h12"/></svg>
  </button>
  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get('file') || '';
    const back = params.get('back') || '../e-portfolio.html#evidencias';
    const safeFile = file.replace(/^\/+/, '');
    const title = decodeURIComponent(safeFile.split('/').pop() || 'Documento PDF');
    document.getElementById('title').textContent = title;
    document.getElementById('open-file').href = safeFile;
    document.getElementById('viewer').innerHTML = '<object data="' + safeFile + '" type="application/pdf"><div class="fallback"><p>O navegador n?o conseguiu mostrar este PDF.</p><p><a class="button gold" href="' + safeFile + '">Abrir PDF</a></p></div></object>';
    function goBack() {
      if (history.length > 1 && document.referrer) {
        history.back();
        return;
      }
      location.href = back;
    }
  </script>
</body>
</html>
